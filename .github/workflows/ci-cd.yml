name: CI/CD

on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging]
  # Recovery path (2026-09-15). Before this, a push event was the ONLY way this
  # lane could start, so when GitHub failed to deliver one the site sat on stale
  # content with no way to re-fire the deploy. Real incident: #91 was merged to
  # main as 94758a2 — the ref moved, Actions was operational, and **zero** workflow
  # runs were created for that sha (0 for the commit, nothing queued repo-wide).
  # `gh run rerun` is not a recovery: the re-run deploys *its own* commit, and the
  # "Decide whether this run may move the production alias" step below deliberately
  # skips a run whose sha is no longer the tip — so re-running an old run would
  # publish the OLD build. Dispatch re-fires the lane at the ref you name, and the
  # sha it produces IS the tip, so the gate + tip-election steps let it through:
  #   gh workflow run "CI/CD" --ref main
  # This adds a trigger; it does not change push/pull_request behaviour.
  workflow_dispatch:

# Cancel stale workflow runs for the same ref (e.g. a PR that gets rapid updates),
# but do NOT cancel the deploy concurrency group — that group uses a separate
# `pages-deploy-` prefix and `cancel-in-progress: false` to protect the alias.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '24'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Show Node version
        run: node --version

      # Hardening: lint/typecheck where configured. These use --if-present so a
      # project without the script does not fail; if the script exists, a red
      # result fails `validate` before the build.
      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

      # Test gate. `npm test` is the repo's declared test entry point
      # (package.json `scripts.test`, globbing tests/**/*.test.js).
      # `*.test.js` does NOT match `*.test.mjs` under Node's test glob — verified
      # on Node 24 — so the .mjs pattern is passed alongside it: otherwise a .mjs
      # suite sits outside the gate and can regress without failing anything.
      # No continue-on-error: a red suite fails `validate`, and `deploy` declares
      # `needs: validate`, so it cannot reach production/staging/development.
      - name: Run tests
        run: |
          npm test
          node --test "tests/**/*.test.mjs"

      # Tina may fail on PRs without secrets (forks) or against protected branches
      # not configured in TinaCloud. On protected/main branch pushes the failure
      # must be visible; on PRs from forks we degrade gracefully.
      - name: Build Tina CMS admin
        run: npx tinacms build
        env:
          NEXT_PUBLIC_TINA_CLIENT_ID: ${{ vars.NEXT_PUBLIC_TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          TINA_BRANCH: ${{ github.ref_name }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: Build Next.js static export
        run: npx next build
        env:
          NEXT_PUBLIC_WALLET_CONNECT_ID: ${{ secrets.NEXT_PUBLIC_WALLET_CONNECT_ID }}
          NEXT_PUBLIC_NEYNAR_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_NEYNAR_CLIENT_ID }}
          NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN }}
          NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}
          NEXT_PUBLIC_MOONPAY_KEY: ${{ secrets.NEXT_PUBLIC_MOONPAY_KEY }}
          NEXT_PUBLIC_TRANSAK_KEY: ${{ secrets.NEXT_PUBLIC_TRANSAK_KEY }}

      - name: Verify build output
        run: |
          ls -la out/ | head -10
          test -f out/index.html && echo "✓ out/index.html exists"
          test -f out/about.html && echo "✓ out/about.html exists"
          test -f out/storefront.html && echo "✓ out/storefront.html exists"
          echo "✓ Next.js export complete"

      # Guards `script-src 'self'` in public/_headers: the policy has no nonce,
      # no hash and no 'unsafe-inline', so it is only safe while the export
      # ships zero executable inline scripts and zero inline event handlers.
      # See docs/csp-inline-script-invariant.md.
      - name: Test the CSP inline-script gate itself
        run: node --test tests/csp/inline-scripts.test.mjs

# SEC-F3 (card t_49b40e3c): the same "guard the guard" rule for the /api/* CORS
      # allowlist — a production deployment must not answer a dev origin, and the
      # allowlist must stay in one module. No build output needed.
      - name: Test the env-gated CORS allowlist itself
        run: node --test tests/security/cors-origins.test.mjs

      # SEC-F1 (t_46a05469): authorization on /api/social/* is derived from
      # `admin_wallets` and ONLY `admin_wallets` — `users.role` is a derived cache
      # (login.js writes it from the admin_wallets decision) and must never be an
      # authorization input. This suite fails if the gate starts trusting the cache
      # again, which would keep a REVOKED admin in for the rest of its session.
      - name: Test the /api/social admin gate itself
        run: node --test tests/social/admin-gate.test.js

      # SEC-F2 (PR #62 review): social_queue.status / results are the operator audit trail.
      # The handler refuses a status outside the enum and refuses to re-dispatch an item
      # that already posted, and migrations/0010 enforces the enum at the storage layer too.
      # Both halves are executable invariants — run them without needing D1 or credentials.
      - name: Test the social publish queue guards (status enum + no double-post)
        run: node --test tests/social/queue-status-guard.test.mjs tests/social/status-enum-migration.test.mjs

      # SEC-F1d (card t_30f803f0): /api/subscribers was the fourth reader of `admin_wallets`
      # and the last one sending `wallet_address = ?` byte-exact, so the live checksummed prod
      # row was 403'd on this route alone while login / functions/api/auth.js / the social gate
      # admitted it. It now sends the same `lower(wallet_address) = ?` those three send, and
      # this suite drives the REAL handler over a real SQLite engine, so a regression to the
      # byte-exact form fails here instead of silently 403ing an admin in prod. It also pins
      # the class (every reader sends one statement) and the decision that the legacy
      # src/worker.js copy is on no deploy path.
      - name: Test the /api/subscribers admin read itself
        run: node --test tests/api/subscribers-admin.test.js

      # Cloudflare's edge injects the Web Analytics beacon into every HTML
      # navigation, so it never appears in `out/` for the check below to see. The
      # only artifact that pins its two required hosts down is the policy itself
      # (card t_83174cd2 — it was blocked with `script-src 'self'` in production).
      - name: Test the Cloudflare Web Analytics beacon carve-out
        run: node --test tests/csp/analytics-beacon.test.mjs

      - name: Assert export ships no executable inline scripts (guards script-src 'self')
        run: node scripts/check-inline-scripts.mjs out

      # Header-VALUE pins (T-follow-up from the #94 verdict, security condition 3).
      # `_headers` has silently shipped three wrong values: a path-less file that
      # applied nothing (M1), XFO DENY contradicting frame-ancestors 'self' (M2),
      # and COOP same-origin severing window.opener for the Coinbase Wallet popup
      # (M3). A build cannot catch any of them — the file parses, the deploy goes
      # green, and prod serves headers nobody asserted. This pair does:
      #   * the suite drives the repo's REAL public/_headers and mutation-tests
      #     every pin, so a pin that stops matching fails here;
      #   * out/_headers is what Cloudflare actually receives, so --same-as is
      #     what makes the pin describe what ships (verified byte-identical on
      #     three real builds; if that ever stops being true the failure is loud).
      # See docs/headers-invariant.md. Drift against prod: .github/workflows/header-drift.yml.
      - name: Test the header-pin gate itself
        run: node --test tests/headers/assert-headers.test.mjs

      - name: Assert the pinned header values survive the build (COOP, XFO, CSP, no COEP)
        run: node scripts/assert-headers.mjs --file out/_headers --same-as public/_headers

      # SEC-F4 (card t_492fdb5b): the /api/* CORS allowlist is ONE exact origin from
      # env.CORS_ORIGIN, resolved by functions/_shared/cors.js. Before this, 17 handlers
      # each carried their own copy and echoed any origin whose host ended with
      # .pages.dev / .cloudflarestaging.com / .ngrok-free.app, or was localhost /
      # 127.0.0.1 — i.e. "the public internet, allowlisted by TLD", measured live on the
      # mutating /api/subscribers/admin/expire-sweep endpoint. The suite drives all 17
      # handlers with the forged origins and locks the source invariants (one Origin
      # reader, no host-suffix matching, no local allowlist copy), so a regression or a
      # copy #18 fails here rather than in a security report.
      - name: Test the CORS allowlist (exact origin, all 17 handlers)
        run: node --test tests/cors/cors-allowlist.test.mjs

      # Redirect-loop class (2026-09-11): Cloudflare Pages turns any '<name>.html'
      # request into a 308 to '<name>', so a `_redirects` 200-rewrite whose TARGET ends
      # in .html bounces the route between the two forever. It was live on
      # supercompute.io — /terms and /privacy were unreachable (curl: Maximum (50)
      # redirects followed) while they looked fine in source. /about has no rule and
      # works; the rule is the defect. Guard the class, not just the two paths.
      - name: Assert _redirects has no .html-target 200 rewrite
        run: |
          # Source must be a concrete path (not the `/*` SPA catch-all): the
          # documented `/*  /index.html  200` fallback is legitimate.
          bad="$(grep -nE '^/[^/*[:space:]][^[:space:]]*[[:space:]]+/[^[:space:]]*\.html[[:space:]]+200[[:space:]]*$' public/_redirects || true)"
          if [ -n "$bad" ]; then
            echo "✗ public/_redirects rewrites a path to a .html file with status 200:"
            echo "$bad"
            echo "  Pages 308s '<name>.html' to '<name>', so the rewrite loops the route."
            echo "  Serve it natively — the asset is already exported by the build."
            exit 1
          fi
          echo "✓ _redirects has no .html-target 200 rewrites"

      # The legal pages are served natively (see the note in public/_redirects), so the
      # only thing keeping /terms reachable is the exported asset. If it stops being
      # exported the route silently falls through to `/*  /index.html` and serves the
      # landing page under a legal URL — fail here instead.
      - name: Assert legal pages are exported
        run: |
          for f in terms privacy; do
            test -f "out/$f.html" || { echo "✗ out/$f.html missing — /$f is unreachable without a _redirects rule"; exit 1; }
          done
          echo "✓ out/terms.html + out/privacy.html exported"

      # The 2026-09-15 /api/projects outage was code/schema drift that no build could see: the
      # handler selected `ticker, stack`, the live D1 table carries `tagline, repo, coin, ...`,
      # and D1's `no such column` escaped the Function into a bodyless `error code: 1101`. This
      # suite drives the REAL handler over a REAL SQLite engine loaded with the REAL DDL
      # (`schema.sql` + every `migrations/*.sql`), so the drift fails here instead of on prod.
      # A mutation case re-installs the pre-fix column list and asserts the guard catches it.
      # Live (repo <-> prod) drift is watched by .github/workflows/d1-schema-drift.yml.
      - name: Assert /api/projects columns match the D1 schema (drift guard)
        run: node --test tests/projects/schema-contract.test.mjs

      - name: Check for debug/code issues
        run: |
          echo "TODO count: $(grep -rc 'TODO' pages/ components/ lib/ 2>/dev/null | wc -l)" || true
          echo "✓ Code scan complete"

  # Election (t_7998fe88): which run is even allowed to enter the deploy lane.
  # This job is deliberately NOT in the deploy concurrency group. GitHub cancels a
  # *pending* job whenever a newer arrival joins the same group, and it has no notion
  # of commit order — so a stale run's arrival can cancel the newest run's pending
  # deploy. Observed live 2026-09-11, immediately after the first version of this fix
  # shipped: run A (older merge) queued 1s after run B (newer merge) had queued, B was
  # cancelled, then A's guard correctly refused to publish — and *nothing* deployed.
  # Keeping non-tip runs out of the group closes that hole: the only jobs that enter
  # it are tip commits, so entrants arrive in commit order and the newest always
  # deploys. It also skips the ~4 minute build for runs nobody needs.
  gate:
    needs: validate
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.elect.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - name: Elect the branch tip
        id: elect
        run: |
          set -uo pipefail
          tip=""
          if ! tip=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" 2>/dev/null | cut -f1) || [ -z "$tip" ]; then
            echo "::warning::could not read refs/heads/${GITHUB_REF_NAME} — allowing this deploy through"
            tip="$GITHUB_SHA"
          fi
          echo "run sha : $GITHUB_SHA"
          echo "tip     : $tip"
          echo "attempt : $GITHUB_RUN_ATTEMPT"
          if [ "${GITHUB_RUN_ATTEMPT:-1}" != "1" ]; then
            echo "manual re-run (attempt $GITHUB_RUN_ATTEMPT) — deploying the requested commit"
          elif [ "$tip" = "$GITHUB_SHA" ]; then
            echo "this run is the newest commit on ${GITHUB_REF_NAME}"
          else
            echo "::warning::$GITHUB_SHA has been superseded by $tip — staying out of the deploy queue so the newer run keeps the alias"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [validate, gate]
    timeout-minutes: 15
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/development') && needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # Serialize deploys per branch (t_7998fe88). Two merges to `main` in the same
    # minute used to build+deploy concurrently and the LAST one to finish claimed the
    # production alias, even when its commit was the OLDER of the two — prod silently
    # regressed to 9de3c8c6 while c6fe38dd (the newer merge) had already deployed.
    # cancel-in-progress MUST stay false: cancelling the newer run would leave the
    # older build live. Only runs that won the `gate` election above (tip commits, in
    # commit order) ever reach this group, and the in-job re-check below stops a run
    # whose commit was superseded mid-build from being the last writer.
    concurrency:
      group: pages-deploy-${{ github.ref }}
      cancel-in-progress: false
    # Environment gate: production deploys require the `production` environment;
    # staging/development use their respective environments. This is a guardrail,
    # not a behavior change to the branch matrix.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/staging' && 'staging' || 'development' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://supercompute.io' || github.ref == 'refs/heads/staging' && 'https://staging.supercompute.io' || 'https://development.supercompute.pages.dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npx next build
        env:
          NEXT_PUBLIC_WALLET_CONNECT_ID: ${{ secrets.NEXT_PUBLIC_WALLET_CONNECT_ID }}
          NEXT_PUBLIC_NEYNAR_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_NEYNAR_CLIENT_ID }}
          NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN }}
          NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}
          NEXT_PUBLIC_MOONPAY_KEY: ${{ secrets.NEXT_PUBLIC_MOONPAY_KEY }}
          NEXT_PUBLIC_TRANSAK_KEY: ${{ secrets.NEXT_PUBLIC_TRANSAK_KEY }}

      - name: Copy Functions into deploy root
        run: |
          cp -r functions out/functions
          echo "✓ Functions copied to out/functions/"

      # Build provenance inside the shipped bytes: `curl -s https://supercompute.io/`
      # now names the exact commit that produced the live HTML, so "which build is
      # live?" is a body check instead of an inference from CI status (t_7998fe88).
      - name: Stamp build provenance into the exported HTML
        run: |
          stamp="<!-- supercompute build ${GITHUB_SHA} ${GITHUB_REF_NAME} $(date -u +%Y-%m-%dT%H:%M:%SZ) -->"
          count=0
          while IFS= read -r f; do
            sed -i "s|</body>|${stamp}</body>|" "$f"
            count=$((count + 1))
          done < <(find out -name '*.html' -type f)
          echo "stamped ${count} HTML files"
          grep -o "supercompute build [0-9a-f]*" out/index.html | head -1

      # Schema before code: the subscriber funnel (/api/subscribers, the tier gate)
      # 500s when its tables are missing, and `wrangler pages deploy` never runs
      # migrations. Only migrations written to be safely re-runnable
      # (CREATE TABLE / CREATE INDEX IF NOT EXISTS) belong in this list — anything
      # that ALTERs or rebuilds a table must be applied deliberately instead.
      #
      # continue-on-error: this step talks to a stricter Cloudflare credential than the
      # deploy above (D1 writes need D1:Edit, which the Pages token never had — run
      # 34647683246 died on the import endpoint with `Authentication error [code: 10000]`
      # on 2026-09-11). A credential/scope problem must not be able to wedge the static
      # deploy — it did, for half an hour, while `/subscribe` sat merged and unshipped —
      # but it must never be silent either: the outcome is re-raised as a hard failure
      # after the deploy steps below.
      #
      # D1 writes need D1:Edit, which the Pages token does not have. The step
      # therefore runs with CLOUDFLARE_D1_TOKEN (the D1 read+write token) and only
      # falls back to CLOUDFLARE_API_TOKEN when that secret is unset — with the
      # fallback the schema step fails as before and the run still goes red below.
      # SEC-F3 (card t_49b40e3c): the tolerance on this step stays, and only for the
      # reason spelled out above — a Cloudflare credential-scope problem must not wedge
      # the static deploy. It is not a pass: the schema is asserted with no tolerance at
      # all by the hard gate at the end of this job. What was removed from the step is
      # the old in-step "assertion": `SELECT name FROM sqlite_master ...` exits 0 when it
      # matches zero rows, so a migration that created nothing was indistinguishable
      # from one that worked. A check that cannot fail is not a check.
      # `projects` is in this list for the same reason `/api/subscribers` is: the table was
      # declared in migrations/0001 but that file was never applied by CI, so the API handler and
      # the live table drifted until GET /api/projects answered a bodyless `error code: 1101` on
      # 2026-09-15. 0001 is `CREATE TABLE/INDEX IF NOT EXISTS` throughout, so on production it is
      # a no-op; on a fresh database it creates the table the handler actually reads.
      # Repo <-> live drift is watched daily by .github/workflows/d1-schema-drift.yml.
      - name: Apply D1 migrations (idempotent)
        id: d1
        continue-on-error: true
        run: |
          for f in migrations/0001_admin_wallets_and_projects.sql migrations/0002_marketplace.sql migrations/0006_add_subscribers.sql migrations/0007_kg_nodes_and_edges.sql migrations/0008_csp_reports.sql migrations/0009_social_command_center.sql migrations/0010_social_queue_status_enum.sql; do
            echo "==> applying $f"
            npx wrangler d1 execute supercompute-db --remote --file="$f" --yes
          done
          npx wrangler d1 execute supercompute-db --remote --yes \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('admin_wallets','kg_edges','kg_nodes','projects','subscribers','marketplace_listings','csp_reports','social_queue','social_posts') ORDER BY name;"
          # Column-level readback: /api/projects 500'd because `projects` existed but lacked the
          # columns the handler selects, so "the table is there" is not the assertion that matters.
          npx wrangler d1 execute supercompute-db --remote --yes \
            --command "SELECT name FROM pragma_table_info('projects') WHERE name IN ('id','name','tagline','description','status','repo','coin','chain','created_at','updated_at') ORDER BY name;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Second half of the serialization guarantee (t_7998fe88). The concurrency group
      # keeps two deploys from overlapping; this keeps an *older* commit from being the
      # last writer. Evaluated immediately before the deploy because the branch tip can
      # move during the ~4 minute build. A manual re-run (attempt > 1) is an operator
      # asking for that specific commit and is always allowed through.
      - name: Decide whether this run may move the production alias
        id: tip
        if: github.ref == 'refs/heads/main'
        run: |
          set -uo pipefail
          tip=""
          if ! tip=$(git ls-remote origin refs/heads/main 2>/dev/null | cut -f1) || [ -z "$tip" ]; then
            echo "::warning::could not read the origin/main tip — allowing this deploy through"
            tip="$GITHUB_SHA"
          fi
          echo "run sha  : $GITHUB_SHA"
          echo "main tip : $tip"
          echo "attempt  : $GITHUB_RUN_ATTEMPT"
          if [ "${GITHUB_RUN_ATTEMPT:-1}" != "1" ]; then
            echo "manual re-run (attempt $GITHUB_RUN_ATTEMPT) — deploying the requested commit"
          elif [ "$tip" = "$GITHUB_SHA" ]; then
            echo "this run is the newest commit on main"
          else
            echo "::warning::superseded by $tip — skipping the production deploy so the newer build keeps the alias"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages (production)
        id: deploy-prod
        if: github.ref == 'refs/heads/main' && steps.tip.outputs.deploy == 'true'
        run: |
          # --branch main is explicit: Pages resolves the production alias from the
          # branch, and an implicit target is how a build lands on the wrong alias.
          npx wrangler pages deploy out --project-name=supercompute --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production alias moved
        if: github.ref == 'refs/heads/main' && steps.deploy-prod.outcome == 'success'
        run: |
          set -uo pipefail
          url="https://supercompute.io"
          expected="supercompute build ${GITHUB_SHA}"
          for i in $(seq 1 18); do
            body=$(curl -fsS -L --max-time 10 "$url" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q "$expected"; then
              echo "✓ production alias serves ${GITHUB_SHA}"
              exit 0
            fi
            echo "attempt $i: production alias not yet on ${GITHUB_SHA}, retrying..."
            sleep 10
          done
          echo "::error::production alias did not move to ${GITHUB_SHA} within 3 minutes"
          exit 1

      - name: Deploy to Cloudflare Pages (staging)
        id: deploy-staging
        if: github.ref == 'refs/heads/staging'
        run: |
          npx wrangler pages deploy out --project-name=supercompute --branch staging --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages (development)
        id: deploy-development
        if: github.ref == 'refs/heads/development'
        run: |
          npx wrangler pages deploy out --project-name=supercompute --branch development --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment
        if: steps.deploy-prod.outcome == 'success' || steps.deploy-staging.outcome == 'success' || steps.deploy-development.outcome == 'success'
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            URL="https://supercompute.io"
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            URL="https://staging.supercompute.io"
          else
            URL="https://development.supercompute.pages.dev"
          fi
          echo "Checking $URL ..."
          curl -fsS --max-time 30 -o /dev/null "$URL" || { echo "ERROR: $URL did not return 200" >&2; exit 1; }
          echo "✓ Deployed and reachable: $URL"

      # Hard gate on the schema (SEC-F3, card t_49b40e3c). The tolerance on the
      # migration step above exists so that a Cloudflare token-scope problem cannot
      # freeze the site (it did: every push to main after 2026-09-11 21:06 was blocked,
      # so /subscribe ship'd code sat undeployed) — this step is what pays for it, with
      # no tolerance of its own and two jobs:
      #
      #   1. re-raise a migration step that did not succeed — not just `failure`, so an
      #      aborted step cannot read as fine (the old check tested `== 'failure'` only).
      #   2. assert the tables are actually IN the database. `SELECT name FROM
      #      sqlite_master ...` succeeds when it returns nothing, so the previous
      #      assertion could not fail; this compares the table list against the expected
      #      set and exits non-zero on any missing table.
      #
      # It runs after the deploy steps on purpose: shipping the static site must not
      # depend on the D1 credential, but a broken schema must never be silent. A red run
      # is the signal; a frozen deploy is not the fix.
      - name: Assert the D1 schema landed (hard gate)
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_APPLY_OUTCOME: ${{ steps.d1.outcome }}
        run: |
          set -uo pipefail
          expected="csp_reports marketplace_listings projects social_accounts social_queue social_posts subscribers"
          failed=0

          if [ "${D1_APPLY_OUTCOME:-unknown}" != "success" ]; then
            echo "::error::the D1 migration step did not succeed (outcome=${D1_APPLY_OUTCOME:-unknown}) — the Cloudflare token needs D1:Edit on supercompute-db."
            failed=1
          fi

          # List every table rather than the expected names, so a name can only appear in
          # the output if the table really exists: the check cannot be satisfied by its
          # own query text.
          out="$(npx wrangler d1 execute supercompute-db --remote --yes \
            --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;" 2>&1)" || {
            echo "$out"
            echo "::error::could not read the table list from D1 — the schema is UNVERIFIED, which is not the same as verified."
            exit 1
          }
          echo "$out"

          missing=""
          for t in $expected; do
            printf '%s\n' "$out" | grep -qw "$t" || missing="$missing $t"
          done

          if [ -n "$missing" ]; then
            echo "::error::D1 schema is missing table(s):$missing — the endpoints behind them 500 until the migration lands. The static site was deployed; the schema was not."
            failed=1
          fi

          if [ "$failed" = "0" ]; then
            echo "✓ D1 schema verified: $expected"
          fi
          [ "$failed" = "0" ] || exit 1
