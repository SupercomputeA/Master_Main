name: D1 schema drift (live)

# Is the LIVE D1 schema still the one the repo's handlers read?
#
# `validate` (ci-cd.yml) runs `tests/projects/schema-contract.test.mjs`, which pins the handler's
# column list against the repo's own DDL (`schema.sql` + `migrations/*.sql`). That catches a code
# change that outruns the tracked schema. It structurally cannot catch the other direction: the
# live database diverging from the tracked schema — the 2026-09-15 state, where `projects` on prod
# carried `tagline`/`repo`/`coin` while the repo and the handler both said `ticker`/`stack`, and
# `GET /api/projects` had been serving a bodyless `error code: 1101` unwatched.
#
# This is the scheduled sentinel for that direction. Read-only, dependency-free, and NOT part of
# the deploy lane: a drift failure reports on the Actions tab and never blocks a deploy.
#
# Run it by hand from the Actions tab to check prod right now.

on:
  workflow_dispatch:
  schedule:
    # Daily, off the hour to avoid the 00:00 UTC Actions stampede (mirrors header-drift.yml).
    - cron: '41 13 * * *'

jobs:
  live-d1-schema:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No `npm ci`: the assertion is dependency-free by design, so the drift check cannot be
      # knocked out by an install failure.
      #
      # CLOUDFLARE_D1_TOKEN is the D1 read+write token the deploy lane already uses for its schema
      # step; the Pages token has no D1 scope and would fail here with `Authentication error
      # [code: 10000]`.
      - name: Assert the live projects table matches the handler's column contract
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/assert-projects-schema.mjs
