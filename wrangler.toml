name = "supercompute"
compatibility_date = "2026-04-30"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "out"

[[d1_databases]]
binding = "DB"
database_name = "supercompute-db"
database_id = "e3c7c7f9-df4a-4e1b-9bc7-97f1faadf282"

[[kv_namespaces]]
binding = "CACHE"
id = "031b7cbbfed44d478d7d7c4abe67c666"

[vars]
# The exact-origin allowlist for every /api/* CORS response (functions/_shared/cors.js
# is the only reader). Comma-separate for more than one. An origin that is not listed
# here is never echoed back — no *.pages.dev / *.ngrok-free.app / localhost suffixes.
CORS_ORIGIN = "https://supercompute.io"
# Dev origins (localhost / 127.0.0.1) are NOT part of the production set. Opt in per
# deployment instead:  npx wrangler pages dev out --binding ALLOW_DEV_ORIGINS=true
# Leave ALLOW_DEV_ORIGINS unset here — setting it in this file would re-trust localhost
# in production, which is exactly the SEC-F4 defect.
QUANTA_TOKEN = "0x5ACDC563450cC35055d7344287C327fafB2b371A"
# SCOM_STAKING — not deployed yet; zero-address makes staking API return defaults
SCOM_STAKING = "0x0000000000000000000000000000000000000000"
# Uniswap V4 Quoter on Base — not deployed yet; zero-address falls back to simulated quote
UNISWAP_QUOTER = "0x0000000000000000000000000000000000000000"
# ENS RPC — mainnet (ENS lives on mainnet, not Base). Public read-only RPCs
# are fine for namehash + text record reads. Functions/api/ens/* fall back to
# https://ethereum-rpc.publicnode.com if unset. Override per-environment via
# the Cloudflare dashboard for higher rate limits.
ENS_RPC_URL = "https://ethereum-rpc.publicnode.com"

# NOTE: Cloudflare Pages only supports the named environments "preview" and
# "production" — a custom [env.staging] block fails Pages config validation and
# breaks every `wrangler pages deploy` from this directory. Staging is therefore
# done as a preview-branch deployment of this same project (see the
# `deploy:staging` script in package.json), which yields a
# <branch>.supercompute.pages.dev URL without a separate project or env block.
